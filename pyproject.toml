[project]
name = "gemini-notebook-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "charliemarciano", email = "charliem@cet.ac.il" }
]
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.57.1",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "notebooklm-py[browser,cookies]>=0.8.2",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.scripts]
gemini-notebook-poc = "gemini_notebook_poc:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true

